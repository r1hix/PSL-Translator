# ==============================================================================
# Real-Time Pakistani Sign Language (PSL) Translator Configuration
# ==============================================================================

project:
  name: "PSL-Translator"
  version: "0.1.0"
  description: "Coordinate-space Real-Time PSL to Urdu text and speech translator"

# ------------------------------------------------------------------------------
# Target Vocabulary (15 High-Frequency Core Dynamic Signs)
# ------------------------------------------------------------------------------
vocabulary:
  - id: 0
    name: "salam"
    urdu: "السلام علیکم"
    roman: "Assalam-o-Alaikum"
    category: "greetings"
  - id: 1
    name: "shukriya"
    urdu: "شکریہ"
    roman: "Shukriya"
    category: "greetings"
  - id: 2
    name: "aap_kaise_hain"
    urdu: "آپ کیسے ہیں؟"
    roman: "Aap Kaise Hain"
    category: "greetings"
  - id: 3
    name: "theek"
    urdu: "ٹھیک"
    roman: "Theek"
    category: "greetings"
  - id: 4
    name: "khuda_hafiz"
    urdu: "خدا حافظ"
    roman: "Khuda Hafiz"
    category: "greetings"
  - id: 5
    name: "pani"
    urdu: "پانی"
    roman: "Pani"
    category: "essentials"
  - id: 6
    name: "khana"
    urdu: "کھانا"

    sentence_en: "I need food / I am hungry."
    sentence_ur: "مجھے کھانا چاہیے، مجھے بھوک لگی ہے۔"
    sentence_roman: "Mujhe khana chahiye, mujhe bhook lagi hai."
    category: "essentials"
  - id: 7
    name: "ghar"
    urdu: "گھر"
    roman: "Ghar"
    sentence_en: "I want to go home."
    sentence_ur: "مجھے گھر جانا ہے۔"
    sentence_roman: "Mujhe ghar jaana hai."
    category: "essentials"
  - id: 8
    name: "madad"
    urdu: "مدد"
    roman: "Madad"
    sentence_en: "Please help me immediately!"
    sentence_ur: "براہ کرم میری مدد کریں!"
    sentence_roman: "Barahe karam meri madad karein!"

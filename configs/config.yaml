# ==============================================================================
# Real-Time Pakistani Sign Language (PSL) Translator Configuration
# ==============================================================================

project:
  name: "PSL-Translator"
  version: "0.1.0"
  description: "Coordinate-space Real-Time PSL to Urdu text and speech translator"

# ------------------------------------------------------------------------------
# Target Vocabulary (15 High-Frequency Core Dynamic Signs)
# ------------------------------------------------------------------------------
vocabulary:
  - id: 0
    name: "salam"
    urdu: "السلام علیکم"
    roman: "Assalam-o-Alaikum"
    sentence_en: "Hello, peace be upon you."
    sentence_ur: "السلام علیکم!"
    sentence_roman: "Assalam-o-Alaikum!"
    category: "greetings"
  - id: 1
    name: "shukriya"
    urdu: "شکریہ"
    roman: "Shukriya"
    sentence_en: "Thank you very much."
    sentence_ur: "آپ کا بہت بہت شکریہ!"
    sentence_roman: "Aap ka bohat bohat shukriya!"
    category: "greetings"
  - id: 2
    name: "aap_kaise_hain"
    urdu: "آپ کیسے ہیں؟"
    roman: "Aap Kaise Hain"
    sentence_en: "How are you doing?"
    sentence_ur: "آپ کیسے ہیں؟"
    sentence_roman: "Aap kaise hain?"
    category: "greetings"
  - id: 3
    name: "theek"
    urdu: "ٹھیک"
    roman: "Theek"
    sentence_en: "I am fine, everything is okay."
    sentence_ur: "میں بالکل ٹھیک ہوں، سب ٹھیک ہے۔"
    sentence_roman: "Main theek hoon, sab theek hai."
    category: "greetings"
  - id: 4
    name: "khuda_hafiz"
    urdu: "خدا حافظ"
    roman: "Khuda Hafiz"
    sentence_en: "Goodbye, take care."
    sentence_ur: "خدا حافظ، اپنا خیال رکھیے گا۔"

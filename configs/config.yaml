    sentence_ur: "جی نہیں، شکریہ۔"
    sentence_roman: "Jee nahi, shukriya."
    category: "essentials"
  - id: 11
    name: "doctor"
    urdu: "ڈاکٹر"
    roman: "Doctor"
    sentence_en: "Please call a doctor right away!"
    sentence_ur: "فوراً ڈاکٹر کو بلائیں!"
    sentence_roman: "Fauran doctor ko bulayein!"
    category: "emergency"
  - id: 12
    name: "dard"
    urdu: "درد"
    roman: "Dard"
    sentence_en: "I am experiencing severe pain."
    sentence_ur: "مجھے شدید درد ہو رہا ہے۔"

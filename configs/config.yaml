    category: "essentials"
  - id: 7
    name: "ghar"
    urdu: "گھر"
    roman: "Ghar"
    category: "essentials"
  - id: 8
    name: "madad"
    urdu: "مدد"
    roman: "Madad"
    category: "essentials"
  - id: 9
    name: "haan"
    urdu: "ہاں"
    roman: "Haan"
    category: "essentials"
  - id: 10
